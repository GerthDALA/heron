# Alembic configuration — reserved for future migrations.
# Current schema is applied directly from app/db/schema.sql at startup;
# numbered SQL migrations live in app/db/migrations/.

[alembic]
script_location = app/db/migrations
sqlalchemy.url = sqlite:///./heron.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
